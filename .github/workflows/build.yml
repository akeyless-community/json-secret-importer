name: Automated Release on Tag Push

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:  # IMPORTANT - both of these are required
      id-token: write
      contents: write
      packages: write
    name: Automated Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # golang.org/x/net >= 0.55.0 (CVE fixes) requires Go 1.25. Using the
          # minor line (not an exact patch) picks up the latest stdlib security fixes.
          go-version: '1.25'

      - name: Fetch secrets from Akeyless
        id: fetch-secrets
        uses: akeyless-community/akeyless-action@v3
        with:
          access-id: ${{ secrets.AKEYLESS_ACCESS_ID }}     # (ex: 'p-iwt13fd19ajd') We recommend storing this as a GitHub Actions secret
          static-secrets: '{"/GitHubActions/githubPAT":"GITHUB_TOKEN"}'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          # distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
